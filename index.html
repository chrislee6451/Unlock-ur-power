<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAKAROT — POWER AWAKENING</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    color: white;
    background:
        radial-gradient(circle at center,
        #182b43 0%,
        #09111e 35%,
        #02040a 70%,
        #000 100%);
    transition: background 1s ease;
}

/* =================================
   AURA
================================= */

#aura {
    position: fixed;
    width: 280px;
    height: 280px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(circle,
        rgba(255,255,255,.9) 0%,
        rgba(150,210,255,.5) 18%,
        rgba(70,150,255,.25) 40%,
        transparent 72%);

    filter: blur(12px);

    opacity: .35;

    transition:
        width 1s,
        height 1s,
        opacity 1s,
        filter 1s;

    animation: auraPulse 1.5s infinite alternate;

    pointer-events: none;
}

@keyframes auraPulse {
    from {
        transform: translate(-50%, -50%) scale(.85);
    }

    to {
        transform: translate(-50%, -50%) scale(1.15);
    }
}

/* =================================
   ENERGY RINGS
================================= */

.ring {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 100px;
    height: 100px;

    border: 2px solid rgba(200,230,255,.5);

    border-radius: 50%;

    transform: translate(-50%, -50%) scale(0);

    pointer-events: none;

    opacity: 0;
}

.ring.active {
    animation: ringExplosion 1s ease-out;
}

@keyframes ringExplosion {

    0% {
        transform: translate(-50%, -50%) scale(.2);
        opacity: .9;
    }

    100% {
        transform: translate(-50%, -50%) scale(7);
        opacity: 0;
    }
}

/* =================================
   STARS / PARTICLES
================================= */

.particle {
    position: fixed;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px #70bfff;

    pointer-events: none;

    animation: particleMove linear infinite;
}

@keyframes particleMove {

    from {
        transform: translateY(110vh);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

/* =================================
   MAIN
================================= */

#app {
    position: relative;

    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    text-align: center;

    cursor: pointer;
}

/* =================================
   CARD
================================= */

.card {

    width: min(92vw, 500px);

    padding: 30px 22px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(25,40,60,.85),
            rgba(2,5,12,.94)
        );

    border:
        1px solid rgba(220,245,255,.35);

    box-shadow:
        0 0 35px rgba(80,170,255,.2),
        inset 0 0 35px rgba(100,190,255,.06);

    backdrop-filter: blur(15px);

    transition: .6s;
}

/* =================================
   TEXT
================================= */

.small {

    font-size: 11px;

    letter-spacing: 5px;

    color: #9fc8e8;

    margin-bottom: 15px;
}

h1 {

    font-size: clamp(38px, 12vw, 70px);

    line-height: .95;

    letter-spacing: 5px;

    color: white;

    text-shadow:
        0 0 8px white,
        0 0 20px #b9e7ff,
        0 0 45px #4fa9ff;

    transition: .6s;
}

h2 {

    margin-top: 12px;

    font-size: 21px;

    letter-spacing: 3px;

    color: #dff5ff;
}

p {

    margin-top: 14px;

    font-size: 16px;

    line-height: 1.6;

    color: #d2e5f2;
}

/* =================================
   POWER
================================= */

#power {

    margin-top: 18px;

    font-size: 42px;

    font-weight: bold;

    letter-spacing: 2px;

    color: white;

    text-shadow:
        0 0 10px white,
        0 0 25px #65baff,
        0 0 50px #358cff;

    transition: .3s;
}

/* =================================
   PROGRESS BAR
================================= */

.progressBox {

    margin-top: 20px;

    width: 100%;

    height: 13px;

    background: rgba(255,255,255,.1);

    border-radius: 20px;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.15);
}

#progress {

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            white,
            #72c5ff,
            #bdeaff
        );

    box-shadow:
        0 0 15px #69baff;

    transition: width .3s;
}

/* =================================
   TAP TEXT
================================= */

#tapText {

    margin-top: 20px;

    font-size: 14px;

    color: #a9c7dc;

    letter-spacing: 2px;

    animation: tapPulse 1s infinite alternate;
}

@keyframes tapPulse {

    from {
        opacity: .5;
    }

    to {
        opacity: 1;
    }
}

/* =================================
   STAGE
================================= */

#stage {

    margin-top: 12px;

    font-size: 15px;

    font-weight: bold;

    color: #c9edff;

    text-shadow: 0 0 10px #5cb8ff;
}

/* =================================
   TAP FLASH
================================= */

.flash {

    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 50;
}

.flash.active {

    animation: flash .25s ease;
}

@keyframes flash {

    0% {
        opacity: .7;
    }

    100% {
        opacity: 0;
    }
}

/* =================================
   SHAKE
================================= */

.shake {

    animation: shake .12s infinite;
}

@keyframes shake {

    0% {
        transform: translate(2px, 1px);
    }

    25% {
        transform: translate(-2px, 2px);
    }

    50% {
        transform: translate(2px, -2px);
    }

    75% {
        transform: translate(-2px, -1px);
    }

    100% {
        transform: translate(1px, 2px);
    }
}

/* =================================
   FINAL
================================= */

.final {

    animation: finalGlow 1s infinite alternate;
}

@keyframes finalGlow {

    from {
        text-shadow:
            0 0 10px white,
            0 0 30px #bcecff;
    }

    to {
        text-shadow:
            0 0 15px white,
            0 0 45px #9cddff,
            0 0 90px #4a9cff;
    }
}

#message {

    margin-top: 18px;

    min-height: 48px;

    color: #dceff9;
}

/* =================================
   RESET
================================= */

#reset {

    display: none;

    margin-top: 20px;

    padding: 12px 22px;

    border: 1px solid rgba(255,255,255,.5);

    border-radius: 25px;

    background: rgba(255,255,255,.08);

    color: white;

    font-weight: bold;

    cursor: pointer;
}

</style>
</head>

<body>

<div id="aura"></div>

<div class="ring" id="ring1"></div>
<div class="ring" id="ring2"></div>

<div class="flash" id="flash"></div>

<div id="app">

    <div class="card" id="card">

        <div class="small">
            KAKAROT'S POWER AWAKENING
        </div>

        <h1 id="title">
            TAP TO<br>AWAKEN
        </h1>

        <h2 id="subtitle">
            YOUR POWER IS WAITING
        </h2>

        <div id="power">
            POWER: 0
        </div>

        <div id="stage">
            BASE FORM
        </div>

        <div class="progressBox">
            <div id="progress"></div>
        </div>

        <div id="message">
            Something inside you is waiting to be released...
        </div>

        <div id="tapText">
            TAP ANYWHERE TO POWER UP ⚡
        </div>

        <button id="reset">
            AWAKEN AGAIN
        </button>

    </div>

</div>


<script>

/* ==========================================
   CREATE PARTICLES
========================================== */

for (let i = 0; i < 100; i++) {

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left =
        Math.random() * 100 + "vw";

    particle.style.animationDuration =
        (2 + Math.random() * 6) + "s";

    particle.style.animationDelay =
        Math.random() * 5 + "s";

    document.body.appendChild(particle);
}


/* ==========================================
   ELEMENTS
========================================== */

const app =
    document.getElementById("app");

const card =
    document.getElementById("card");

const title =
    document.getElementById("title");

const subtitle =
    document.getElementById("subtitle");

const power =
    document.getElementById("power");

const stage =
    document.getElementById("stage");

const message =
    document.getElementById("message");

const progress =
    document.getElementById("progress");

const tapText =
    document.getElementById("tapText");

const aura =
    document.getElementById("aura");

const flash =
    document.getElementById("flash");

const reset =
    document.getElementById("reset");

const ring1 =
    document.getElementById("ring1");

const ring2 =
    document.getElementById("ring2");


/* ==========================================
   GAME SETTINGS
========================================== */

let taps = 0;

const maxTaps = 25;


/* ==========================================
   POWER STAGES
========================================== */

const stages = [

    {
        tap: 0,
        name: "BASE FORM",
        title: "KAKAROT",
        subtitle: "THE POWER IS SLEEPING",
        power: "POWER: 1,000",
        message:
        "Something inside you is waiting to be released..."
    },

    {
        tap: 3,
        name: "POWER SURGE",
        title: "POWER",
        subtitle: "THE ENERGY RISES",
        power: "POWER: 5,000",
        message:
        "You can feel the energy beginning to move."
    },

    {
        tap: 6,
        name: "SUPER SAIYAN",
        title: "SUPER",
        subtitle: "THE FIRST TRANSFORMATION",
        power: "POWER: 50,000",
        message:
        "The first limit has been broken."
    },

    {
        tap: 10,
        name: "SUPER SAIYAN 2",
        title: "LIMIT",
        subtitle: "THE LIGHTNING AWAKENS",
        power: "POWER: 250,000",
        message:
        "Your power is becoming something extraordinary."
    },

    {
        tap: 14,
        name: "SUPER SAIYAN 3",
        title: "OVERDRIVE",
        subtitle: "POWER WITHOUT LIMIT",
        power: "POWER: 1,000,000",
        message:
        "The pressure is becoming impossible to contain."
    },

    {
        tap: 18,
        name: "GOD POWER",
        title: "DIVINE",
        subtitle: "THE GODLY ENERGY AWAKENS",
        power: "POWER: 10,000,000",
        message:
        "Your energy has crossed into another realm."
    },

    {
        tap: 21,
        name: "SUPER SAIYAN BLUE",
        title: "BLUE",
        subtitle: "PERFECT POWER",
        power: "POWER: 100,000,000",
        message:
        "Power alone isn't enough anymore..."
    },

    {
        tap: 23,
        name: "ULTRA INSTINCT — SIGN",
        title: "INSTINCT",
        subtitle: "THE BODY MOVES ON ITS OWN",
        power: "POWER: ???",
        message:
        "Stop thinking. Let instinct take control."
    },

    {
        tap: 24,
        name: "ULTRA INSTINCT",
        title: "AWAKENING",
        subtitle: "THE SILVER AURA",
        power: "POWER: UNMEASURABLE",
        message:
        "One final step remains..."
    },

    {
        tap: 25,
        name: "MASTERED ULTRA INSTINCT",
        title: "ULTRA<br>INSTINCT",
        subtitle: "MASTERED",
        power: "∞",
        message:
        "YOU BROKE EVERY LIMIT. THE IMPOSSIBLE HAS BEEN AWAKENED."
    }

];


/* ==========================================
   GET CURRENT STAGE
========================================== */

function getStage() {

    let current = stages[0];

    for (const s of stages) {

        if (taps >= s.tap) {
            current = s;
        }

    }

    return current;
}


/* ==========================================
   UPDATE WEBSITE
========================================== */

function update() {

    const current = getStage();

    title.innerHTML =
        current.title;

    subtitle.textContent =
        current.subtitle;

    power.textContent =
        current.power;

    stage.textContent =
        current.name;

    message.textContent =
        current.message;

    progress.style.width =
        (taps / maxTaps * 100) + "%";


    /* AURA GETS STRONGER */

    const auraSize =
        280 + (taps * 20);

    aura.style.width =
        auraSize + "px";

    aura.style.height =
        auraSize + "px";

    aura.style.opacity =
        .35 + (taps / maxTaps * .65);


    /* MORE POWER = MORE GLOW */

    title.style.transform =
        "scale(" +
        (1 + taps * .008) +
        ")";


    /* SPECIAL STAGES */

    if (taps >= 18) {

        aura.style.filter =
            "blur(18px)";

    }

    if (taps >= 23) {

        document.body.style.background =
        "radial-gradient(circle at center,#40566b 0%,#111c2d 30%,#02050c 70%,#000 100%)";

    }


    if (taps >= 24) {

        title.classList.add("final");

    }


    if (taps === 25) {

        finalTransformation();

    }
}


/* ==========================================
   TAP EFFECT
========================================== */

function tapEffect() {

    flash.classList.remove("active");

    void flash.offsetWidth;

    flash.classList.add("active");


    ring1.classList.remove("active");

    ring2.classList.remove("active");

    void ring1.offsetWidth;

    ring1.classList.add("active");

    setTimeout(() => {

        ring2.classList.add("active");

    }, 120);


    card.classList.remove("shake");

    void card.offsetWidth;

    card.classList.add("shake");


    setTimeout(() => {

        card.classList.remove("shake");

    }, 140);

}


/* ==========================================
   FINAL TRANSFORMATION
========================================== */

function finalTransformation() {

    document.body.classList.add("shake");

    title.classList.add("final");

    tapText.textContent =
        "ULTRA INSTINCT HAS BEEN MASTERED ⚡";

    message.textContent =
        "KAKAROT HAS TRANSCENDED EVERY LIMIT. 👊";

    setTimeout(() => {

        document.body.classList.remove("shake");

    }, 1500);

    reset.style.display =
        "inline-block";
}


/* ==========================================
   TAP ANYWHERE
========================================== */

app.addEventListener("click", function(e) {

    /* Don't count reset button as a power tap */

    if (e.target === reset) {
        return;
    }

    if (taps >= maxTaps) {
        return;
    }

    taps++;

    tapEffect();

    update();

});


/* ==========================================
   RESET
========================================== */

reset.addEventListener("click", function(e) {

    e.stopPropagation();

    taps = 0;

    reset.style.display =
        "none";

    title.classList.remove("final");

    tapText.textContent =
        "TAP ANYWHERE TO POWER UP ⚡";

    document.body.style.background =
        "radial-gradient(circle at center,#182b43 0%,#09111e 35%,#02040a 70%,#000 100%)";

    update();

});


/* ==========================================
   INITIAL
========================================== */

update();

</script>

</body>
  </html>
